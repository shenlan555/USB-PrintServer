name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行直接取消，省 runner 配额
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }} (x64 Release)
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: PrintServer
            solution: PrintServer-cpp/PrintServer.sln
            artifact: PrintServer-x64
          - target: PrintClient
            solution: PrintClient-cpp/PrintClient.sln
            artifact: PrintClient-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 镜像自带 v143 + MFC 时秒过；缺失才补装（见 .github/actions/ensure-mfc）
      - name: Ensure MSVC toolset and MFC
        uses: ./.github/actions/ensure-mfc

      - name: Build
        shell: pwsh
        run: |
          msbuild "${{ matrix.solution }}" `
            /m /p:Configuration=Release /p:Platform=x64 `
            /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect artifacts
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path . -Directory -Recurse -Filter bin |
                 Where-Object { $_.FullName -match '\\bin$' }
          foreach ($d in $bin) {
            Write-Host "bin dir: $($d.FullName)"
            Get-ChildItem $d.FullName -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          }
          $out = "out/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # bin/<Platform>/<Configuration>/ 下的 exe 与 pdfium.dll（若有）
          Get-ChildItem -Path . -Recurse -Include "${{ matrix.target }}.exe" |
            ForEach-Object { Copy-Item $_.FullName -Destination $out -Force }
          $dll = Get-ChildItem -Path . -Recurse -Filter pdfium.dll | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName -Destination $out -Force }
          Get-ChildItem $out -File | Select-Object Name, Length | Format-Table -AutoSize
          if (-not (Test-Path "$out/${{ matrix.target }}.exe")) {
            Write-Error "未找到 ${{ matrix.target }}.exe，构建输出缺失"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}/
          if-no-files-found: error

  # 命令行自检只在 Debug 构建里保留（Release 交付版已剥离，防止被当作免授权入口），
  # 所以单独跑一个 Debug 作业：加密向量、HTTP API、TCP 打印三条链路任一失败即红。
  selftest:
    name: Self-test (x64 Debug)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure MSVC toolset and MFC
        uses: ./.github/actions/ensure-mfc

      - name: Build (Debug)
        shell: pwsh
        run: |
          msbuild "PrintServer-cpp/PrintServer.sln" `
            /m /p:Configuration=Debug /p:Platform=x64 `
            /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run self-tests
        shell: pwsh
        run: |
          $exe = "PrintServer-cpp\bin\x64\Debug\PrintServer.exe"
          if (-not (Test-Path $exe)) { Write-Error "未找到 $exe"; exit 1 }

          $out = "out/selftest"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $cases = @(
            @{ name = "crypto"; args = @("/cryptotest", "PrintServer-cpp\testdata\crypto_vectors.txt", "$out\crypto_report.txt") },
            @{ name = "api";    args = @("/apitest",    "$out\api_report.txt") },
            @{ name = "tcp";    args = @("/tcptest",    "$out\tcp_report.txt") }
          )

          $failed = @()
          foreach ($c in $cases) {
            # 目标程序是 GUI 子系统（/SUBSYSTEM:WINDOWS），直接调用不会等待进程结束；
            # 必须 Start-Process -Wait，否则报告还没写出来就去读取、且拿不到退出码。
            $argLine = ($c.args | ForEach-Object { '"' + $_ + '"' }) -join ' '
            $proc = Start-Process -FilePath $exe -ArgumentList $argLine -Wait -PassThru -NoNewWindow
            $code = $proc.ExitCode
            $report = $c.args[-1]
            Write-Host "==== $($c.name): exit=$code ===="
            if (Test-Path $report) {
              Get-Content $report | Select-Object -Last 4 | ForEach-Object { Write-Host "    $_" }
            } else {
              Write-Host "    报告缺失: $report"
            }
            if ($code -ne 0) { $failed += $c.name }
          }

          if ($failed.Count -gt 0) {
            Write-Error "自测失败: $($failed -join ', ')"
            exit 1
          }
          Write-Host "全部自测通过"

      - name: Upload self-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-reports
          path: out/selftest/
          if-no-files-found: warn
