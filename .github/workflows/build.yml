name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }} (x64 Release)
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: PrintServer
            solution: PrintServer-cpp/PrintServer.sln
            artifact: PrintServer-x64
          - target: PrintClient
            solution: PrintClient-cpp/PrintClient.sln
            artifact: PrintClient-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # windows-2022：镜像的 v142 工具集不含 MFC，构建改用 v143（源码兼容，MFC 完整）
      - name: Install MSVC toolset and MFC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          Write-Host "VS: $installPath"
          # 依次尝试 v142 MFC + v143 MFC（不同镜像 VS 版本组件 ID 不同）
          # 镜像上的 14.29 无 MFC，只有较新工具集带 MFC；补装 v143 全家桶保证可用
          $components = @(
            "Microsoft.VisualStudio.Component.VC.v143.x86.x64",
            "Microsoft.VisualStudio.Component.VC.ATLMFC"
          )
          $args = @("modify", "--installPath", "$installPath", "--quiet", "--norestart", "--nocache")
          foreach ($c in $components) { $args += "--add"; $args += $c }
          & $installer @args | Out-Null
          $exit = $LASTEXITCODE
          Write-Host "vs_installer exit code: $exit"
          if ($exit -ne 0 -and $exit -ne 3010) { exit $exit }

          # 打印已安装的 MFC 库路径，便于排查
          Get-ChildItem "$installPath\VC\Tools\MSVC" -Directory | ForEach-Object {
            $mfc = Join-Path $_.FullName "atlmfc\lib\x64"
            Write-Host "$($_.Name) MFC: $(Test-Path $mfc)"
          }

      - name: Build
        shell: pwsh
        run: |
          msbuild "${{ matrix.solution }}" `
            /m /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect artifacts
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path . -Directory -Recurse -Filter bin |
                 Where-Object { $_.FullName -match '\\bin$' }
          foreach ($d in $bin) {
            Write-Host "bin dir: $($d.FullName)"
            Get-ChildItem $d.FullName -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          }
          $out = "out/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # bin/<Platform>/<Configuration>/ 下的 exe 与 pdfium.dll（若有）
          Get-ChildItem -Path . -Recurse -Include "${{ matrix.target }}.exe" |
            ForEach-Object { Copy-Item $_.FullName -Destination $out -Force }
          $dll = Get-ChildItem -Path . -Recurse -Filter pdfium.dll | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName -Destination $out -Force }
          Get-ChildItem $out -File | Select-Object Name, Length | Format-Table -AutoSize
          if (-not (Test-Path "$out/${{ matrix.target }}.exe")) {
            Write-Error "未找到 ${{ matrix.target }}.exe，构建输出缺失"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}/
          if-no-files-found: error
